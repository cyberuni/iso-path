parsers:
  "**/*.cjs": "es6"
  "**/*.mjs": "es6"
  "**/*.ts": "typescript"
ignores:
  # Resolved by name from config rather than imported, so depcheck cannot see them.
  - "@commitlint/config-conventional"
  - "@repobuddy/biome"
  - "@types/node"
  - "@vitest/coverage-v8"
  # Used only as bins in package.json scripts or git hooks.
  - "@biomejs/biome"
  - "@changesets/cli"
  - "@commitlint/cli"
  - husky
  - npm-run-all2
  - rimraf
